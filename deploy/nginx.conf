user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Query string может содержать ИНН: журналируем только URI без параметров.
    log_format safe escape=json
        '{"time":"$time_iso8601","method":"$request_method","uri":"$uri",'
        '"status":$status,"request_id":"$upstream_http_x_request_id"}';
    access_log /dev/stdout safe;
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
