components:
  schemas:
    Actor:
      type: string
      enum:
      - system
      - client
      - bank
      title: Actor
    ApplicationResponse:
      properties:
        id:
          type: string
          title: Id
        status:
          $ref: '#/components/schemas/Status'
        status_label:
          type: string
          title: Status Label
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        company:
          $ref: '#/components/schemas/CompanyResponse'
        requested_amount:
          type: integer
          title: Requested Amount
        term_months:
          type: integer
          title: Term Months
        goal:
          $ref: '#/components/schemas/Goal'
        goal_label:
          type: string
          title: Goal Label
        pipeline:
          items:
            $ref: '#/components/schemas/PipelineStage'
          type: array
          title: Pipeline
        decision:
          anyOf:
          - $ref: '#/components/schemas/DecisionResponse'
          - type: 'null'
        sign_attempts_left:
          type: integer
          title: Sign Attempts Left
        signed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Signed At
        disbursed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Disbursed At
        events:
          items:
            $ref: '#/components/schemas/EventResponse'
          type: array
          title: Events
      type: object
      required:
      - id
      - status
      - status_label
      - error_message
      - created_at
      - updated_at
      - company
      - requested_amount
      - term_months
      - goal
      - goal_label
      - pipeline
      - decision
      - sign_attempts_left
      - signed_at
      - disbursed_at
      - events
      title: ApplicationResponse
    ApplicationSummary:
      properties:
        id:
          type: string
          title: Id
        status:
          $ref: '#/components/schemas/Status'
        status_label:
          type: string
          title: Status Label
        created_at:
          type: string
          format: date-time
          title: Created At
        company_name:
          type: string
          title: Company Name
        requested_amount:
          type: integer
          title: Requested Amount
        approved_amount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Approved Amount
        goal:
          $ref: '#/components/schemas/Goal'
      type: object
      required:
      - id
      - status
      - status_label
      - created_at
      - company_name
      - requested_amount
      - approved_amount
      - goal
      title: ApplicationSummary
    BankDecisionRequest:
      properties:
        action:
          type: string
          enum:
          - approve
          - reject
          title: Action
        comment:
          type: string
          maxLength: 500
          title: Comment
          default: ''
      additionalProperties: false
      type: object
      required:
      - action
      title: BankDecisionRequest
    CompanyResponse:
      properties:
        inn:
          type: string
          pattern: ^(?:[0-9]{10}|[0-9]{12})$
          title: Inn
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        annual_revenue:
          type: integer
          minimum: 1.0
          title: Annual Revenue
        monthly_payments:
          type: integer
          minimum: 0.0
          title: Monthly Payments
        credit_history:
          $ref: '#/components/schemas/CreditHistory'
        business_age_years:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Business Age Years
        segment:
          type: string
          enum:
          - retail
          - services
          - production
          title: Segment
      type: object
      required:
      - inn
      - name
      - annual_revenue
      - monthly_payments
      - credit_history
      - business_age_years
      - segment
      title: CompanyResponse
    CreateApplication:
      properties:
        requested_amount:
          type: integer
          maximum: 15000000.0
          minimum: 300000.0
          title: Requested Amount
        term_months:
          type: integer
          maximum: 36.0
          minimum: 3.0
          title: Term Months
        goal:
          $ref: '#/components/schemas/Goal'
        company:
          $ref: '#/components/schemas/CompanyResponse'
      additionalProperties: false
      type: object
      required:
      - requested_amount
      - term_months
