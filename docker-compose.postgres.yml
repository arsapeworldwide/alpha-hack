services:
  postgres:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_DB: credit
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synthetic-postgres-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d credit"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  backend:
    environment:
      DATABASE_URL: postgresql+psycopg://credit:${POSTGRES_PASSWORD:-synthetic-postgres-password}@postgres:5432/credit
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
