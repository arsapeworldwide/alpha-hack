# nginx для фронтенда: отдаёт собранное приложение и проксирует /api на бэкенд.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Проверка живости контейнера (HEALTHCHECK в Dockerfile)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API. Адрес бэкенда через переменную + resolver: nginx стартует, даже если бэкенд ещё
    # не запущен (или работаем в режиме мока без бэкенда), и находит его, когда тот поднимется.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # Файлы сборки с хешем в имени можно кешировать надолго
    # (заголовки безопасности повторены в каждом location: в nginx add_header внутри location
    #  отменяет заголовки, заданные уровнем выше)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # SPA: все остальные пути отдают index.html
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        try_files $uri /index.html;
    }
}
