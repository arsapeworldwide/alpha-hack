services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
        VITE_API_BASE_URL: /api
        VITE_MOCK_BKI_FAILURE: ${VITE_MOCK_BKI_FAILURE:-false}
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: alfa-credit-backend:local
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./.env.example
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/credit.db}
      BANK_API_TOKEN: ${BANK_API_TOKEN:-demo-bank-token}
      PIPELINE_STEP_SECONDS: ${PIPELINE_STEP_SECONDS:-1}
      SIMULATE_BKI_FAILURE: ${SIMULATE_BKI_FAILURE:-false}
      DEMO_MODE: ${DEMO_MODE:-true}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      EGRUL_PROVIDER: ${EGRUL_PROVIDER:-simulator}
      BKI_PROVIDER: ${BKI_PROVIDER:-simulator}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://localhost:8080"]}'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - backend_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  backend_data:
